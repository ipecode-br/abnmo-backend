name: svm_dev

services:
  database:
    image: postgres:17-alpine
    container_name: 'svm_dev_postgres'
    env_file:
      - ../../../.env.docker
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - svm_dev_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE}']
      timeout: 5s
      retries: 10
    networks:
      - svm_dev_network

  api:
    build:
      context: ../../..
      dockerfile: infra/docker/dev/Dockerfile
    image: svm-dev-api
    container_name: 'svm_dev_api'
    ports:
      - '${API_PORT}:3333'
    env_file:
      - ../../../.env.docker
    depends_on:
      database:
        condition: service_healthy
    networks:
      - svm_dev_network

networks:
  svm_dev_network:
    driver: bridge

volumes:
  svm_dev_pg_data:
